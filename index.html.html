<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>
</head>
<body style="
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center; /* Центрируем сам прямоугольник на экране */
    align-items: center;     /* Центрируем прямоугольник по вертикали */
    min-height: 100vh;       /* Чтобы центр считался от всего экрана */
    background-color: #fff0f5; /* Сделали нежно-розовый фон для сайта */
">

    <!-- Ваш прямоугольник, отцентрированный на экране -->
    <div style="
        border: 3px solid #4CAF50; 
        padding: 30px; 
        text-align: center; 
        max-width: 450px; 
        border-radius: 8px; 
        background-color: #f9f9f9; 
        font-family: Arial, sans-serif;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1); /* Добавили мягкую тень */
    ">
        <!-- Текст из прошлого кода -->
        <div style="
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px; /* Отступ снизу, чтобы текст не прилипал к сердечкам */
        ">
            Я ТЕБЯ ОЧЕНЬ ЛЮБЛЮ!!!
        </div>

        <!-- СЕРДЕЧКИ ПОСЕРЕДИНЕ (ПОД ТЕКСТОМ) -->
        <div style="
            font-size: 40px;        /* Размер сердечек */
            color: #ff3366;         /* Яркий розово-красный цвет */
            letter-spacing: 8px;    /* Расстояние между сердечками */
            user-select: none;      /* Запрет на случайное выделение мыscale */
        ">
            &#10084; &#10084; &#10084;
        </div>
    </div>

</body>
